generated: '2026-09-02'
method: searched
source: https://crawlgraph.com/docs/api
also_derived_from: openapi/crawlgraph-v1-api-openapi.yml
summary: >-
  Cross-cutting request/response semantics for the CrawlGraph REST API v1 and the hosted MCP
  server, captured from the published docs and the live OpenAPI. JSON in, JSON out, bearer auth,
  a flat error envelope with a request id, and explicit per-tier rate-limit headers on every 2xx.
  Idempotency keys are NOT supported and pagination does not exist — both are honest absences,
  recorded here so an agent does not assume otherwise.

authentication:
  style: bearer_token
  header: Authorization
  key_prefix: cg_live_
  see: authentication/crawlgraph-authentication.yml

content_negotiation:
  request: application/json
  response: application/json
  note: JSON only. No XML, no form encoding, no content negotiation.

idempotency:
  documented: false
  header: null
  note: >-
    No Idempotency-Key mechanism is documented. It matters less than usual here because the API is
    effectively read-only: 4 of 6 operations are safe lookups, and the MCP tools all carry
    idempotentHint true / readOnlyHint true annotations. The two state-changing routes are
    POST /api/v1/free-key (guarded instead by "one active key per email") and
    POST /api/v1/gap-analysis (a resubmission spends another gap job — there is no dedupe).
  safe_to_retry:
    - POST /api/v1/backlinks
    - GET /api/v1/releases
    - GET /api/v1/gap-analysis/{job_id}
    - GET /api/v1/changes
  not_safe_to_retry:
    - POST /api/v1/gap-analysis
    - POST /api/v1/free-key

reversibility:
  grade: documented
  summary: >-
    Nearly the whole surface is read-only, so reversibility is `na` for four of six operations.
    Only two operations change state, and they sit at opposite ends of the scale: an API key can
    be fully revoked from the account page at any time with no window, and a gap-analysis job
    cannot be cancelled, refunded or undone at all. The grade is `documented` rather than
    `verified` because the one real reversal — key revocation — is described in the docs
    ("revoke and create a new one") without a stated window or a documented API operation, and
    because the irreversible side is stated but not bounded. NO WINDOW IS ASSERTED HERE THAT THE
    PROVIDER DOES NOT STATE.
  write_surfaces:
    - operation: request_free_key_api_v1_free_key_post
      path: POST /api/v1/free-key
      effect: >-
        Provisions a free-tier API credential and emails it. One active key per email address.
      reversal:
        exists: true
        mechanism: revoke the key from the account page
        operation_id: null
        api_operation: none — revocation is a dashboard action, not a published REST operation
        window: >-
          None stated, and none needed: the docs place no time limit on revocation. A revoked key
          fails closed immediately with 401 auth_invalid.
        window_documented: false
        docs: https://crawlgraph.com/docs/api
        quote: >-
          "The full key is shown only once at creation. If you lose it, revoke and create a new
          one - there's no recovery path."
        caveat: >-
          Revocation destroys the credential; it does not recover it. There is no key-recovery
          path, so the reversal available is "make this key stop working", never "get this key
          back". An agent that loses a key must re-provision, and the free tier allows only one
          active key per email.
      grade: documented
    - operation: v1_gap_submit_api_v1_gap_analysis_post
      path: POST /api/v1/gap-analysis
      effect: >-
        Creates an owner-scoped async job (retained 7 days) and immediately spends one of the
        50 monthly gap jobs.
      reversal:
        exists: false
        mechanism: none
        operation_id: null
        window: null
        window_documented: false
        docs: https://crawlgraph.com/docs/api
        quote: 'Failed jobs don''t refund quota in v1. Email support with the request_id if it matters.'
        caveat: >-
          There is no cancel, no delete, and no refund. Even a job that FAILS on the server side
          keeps the quota it consumed; the only remedy named is a human email to support quoting
          the request_id. An agent should treat every gap submission as spend that cannot be
          recovered, and should not retry a failed job speculatively — a retry costs another job
          from the same 50.
      grade: none
  read_only_operations:
    - v1_lookup_backlinks_api_v1_backlinks_post
    - v1_list_releases_api_v1_releases_get
    - v1_gap_poll_api_v1_gap_analysis__job_id__get
    - v1_changes_api_v1_changes_get
  note: >-
    POST /api/v1/backlinks is a POST but not a write: it uses a request body to carry the query
    and has no persistent effect beyond decrementing quota. The MCP tool that wraps it publishes
    readOnlyHint true / destructiveHint false. It is therefore `na` for reversibility.

dry_run_mode:
  supported: false
  status: na
  note: >-
    No test mode, no simulate/validate flag, no preview parameter on any operation. It matters
    little for the read paths, but it means there is no way to rehearse a gap submission before
    it spends a job. See sandbox/crawlgraph-sandbox.yml.

pagination:
  supported: false
  style: none
  note: >-
    No cursor, page or offset parameter exists on any operation. Result-set size is controlled by
    the `limit` request field on /backlinks (default 1000, max 10000) and the response carries
    `total_linking_domains` alongside `returned` so the caller can see truncation. The docs are
    explicit that this is deliberate: "The API is for programmatic use, not bulk export - use the
    dashboard for full datasets." /changes caps each snapshot at 100,000 observed domains and
    signals overflow with a boolean `truncated` plus `cap`.
  truncation_signals: [total_linking_domains, returned, truncated, cap]

sorting:
  supported: true
  parameter: sort
  values: [authority, hosts]
  default: authority
  note: 'authority = cg_authority DESC then num_hosts DESC; hosts = legacy num_hosts DESC.'

field_selection:
  supported: false
  note: >-
    No sparse-fieldsets or expansion mechanism. Response field names are the internal service's
    own — the docs state plainly "Field names match the internal service: linking_domain,
    num_hosts, tld. No rename layer."

async_pattern:
  style: submit-and-poll
  submit: POST /api/v1/gap-analysis
  submit_status: 202
  poll: GET /api/v1/gap-analysis/{job_id}
  poll_url_returned: true
  states: [queued, running, completed, failed]
  progress_field: progress_pct
  retention: 7 days
  callbacks: false
  note: >-
    Polling is the only async pattern. Docs section 7: "Webhooks are coming in a future version."
    The MCP gap_analysis tool hides the poll loop and returns the completed result directly.

request_tracing:
  header: X-Request-ID
  in_body: request_id
  body_field_prefix: req_
  note: Present on error bodies and returned as a response header; quote it on support tickets.

rate_limit_signalling:
  headers:
    - X-RateLimit-Limit-Backlinks
    - X-RateLimit-Remaining-Backlinks
    - X-RateLimit-Limit-Gap
    - X-RateLimit-Remaining-Gap
    - X-RateLimit-Reset
    - Retry-After
  exhaustion_status: 429
  present_on: every 2xx response and all 429s
  see: rate-limits/crawlgraph-rate-limits.yml

versioning:
  scheme: uri-path
  current: v1
  path_prefix: /api/v1
  policy: >-
    Breaking changes land on /api/v2 with a deprecation window; v1 integrations "won't break
    overnight". No dated Sunset/Deprecation header mechanism (RFC 8594) is documented.
  see: lifecycle/crawlgraph-lifecycle.yml

error_envelope:
  media_type: application/json
  rfc9457: false
  shape: '{ "error": "<code>", "message": "<human readable>", "request_id": "req_..." }'
  see: errors/crawlgraph-problem-types.yml

data_freshness:
  cadence: quarterly Common Crawl release
  current_release: cc-main-2026-apr-may-jun
  caveat: >-
    Every response describes a periodic snapshot, not live monitoring. The /changes response
    carries an explicit `snapshot_caveat` string restating that absence from a newer snapshot
    does not prove a link was removed — a notable piece of honesty to ship inside the payload.
  cache: per-domain results cached 30 days (SQLite), queried from DuckDB over Common Crawl files

cross_links:
  authentication: authentication/crawlgraph-authentication.yml
  errors: errors/crawlgraph-problem-types.yml
  rate_limits: rate-limits/crawlgraph-rate-limits.yml
  lifecycle: lifecycle/crawlgraph-lifecycle.yml
  data_model: data-model/crawlgraph-data-model.yml

note: >-
  Versioning policy is stated in prose; everything operational around it is absent. Probes
  confirmed there is no status page and no changelog page. Re-probed 2026-09-02, and the FAILURE
  MODE HAS CHANGED SHAPE without changing substance: /status and /changelog now answer HTTP 308 and
  redirect to /backlinks/status and /backlinks/changelog, which return HTTP 200 rendering the
  domain-report route's "isn't a valid domain name" fallback. It is the same soft-404, reached one
  redirect later. A probe that stops at the 308, or that credits the final 200 without reading the
  body, will now record two pages this provider does not publish.

versioning:
  scheme: uri-path
  current_version: v1
  path_prefix: /api/v1
  spec_version: 1.2.2        # info.version in the live OpenAPI, re-harvested 2026-09-02 (was 1.2.0)
  policy_documented: true
  policy: >-
    "The current API is at v1. Breaking changes will land on /api/v2 with a deprecation window -
    your v1 integrations won't break overnight."
  policy_url: https://crawlgraph.com/docs/api
  note: >-
    A named next-major path and a promised deprecation window, but no stated window LENGTH and no
    dated notice mechanism. The spec's info.version (1.2.0) moves independently of the path
    version and is regenerated on every deploy, so it is a build stamp rather than a contract.


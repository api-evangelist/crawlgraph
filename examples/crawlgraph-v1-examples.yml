gap_in_the_spec:
  finding: >-
    Every example above lives only in the HTML docs. The machine-readable spec at
    /api/v1/openapi.json carries none of them, so a client generated from the spec alone gets
    correct types and no idea what a real call looks like. Adding `examples` to the request bodies
    and 2xx responses would be a small, purely additive change to the FastAPI models and would
    move the spec's content score without changing a single route.
  affected_operations: 6
  examples_present_in_spec: 0


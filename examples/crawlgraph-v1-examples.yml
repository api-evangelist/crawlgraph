summary: >-
  CrawlGraph's upstream OpenAPI carries accurate schemas and ZERO examples — the FastAPI generator
  emits neither `example` nor `examples` on any request body, parameter or response. The provider
  publishes them anyway, on the docs page, and they are unusually complete: every operation ships a
  full request body, a full response body, and working curl / Python (requests) / Node (fetch)
  snippets, with the async job shown in all four of its states. This file indexes what the provider
  publishes and where, so the gap between "the spec has no examples" and "the provider documents
  every call" is visible as data rather than being scored as an absence.
  Values below are the PROVIDER'S OWN published examples, quoted as-is. Nothing was authored here.
coverage:
  operations_in_spec: 6
  operations_with_published_request_example: 4
  operations_with_published_response_example: 5
  operations_with_code_samples: 4
  examples_in_the_openapi_itself: 0
  languages: [curl, python-requests, node-fetch]
note: >-
  free-key is documented with a request example in the Quickstart but no response body is shown —
  deliberately, because the key is emailed and "is never returned in this response". The
  gap-analysis poll operation has four documented response shapes (queued/running/completed/failed)
  and no request body, which is why the request and response counts differ.


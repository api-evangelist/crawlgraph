    registry: npm
    url: https://www.npmjs.com/package/crawlgraph-mcp
    repository: https://github.com/pucilpet/crawlgraph-mcp
    language: TypeScript
    kind: mcp-server
    official: true
    license: MIT
    version: 0.1.0
    published: '2026-05-31'
    versions_published: 1
    bin: crawlgraph-mcp
    install: npx -y crawlgraph-mcp
    runtime: node >=18
    dependencies: ['@modelcontextprotocol/sdk ^1.0.4', 'express ^4.21.2', 'zod ^3.23.8']
    description: >-
      MCP server for the CrawlGraph backlink-intelligence API. Four tools: backlinks,
      gap_analysis, gap_outreach_targets, releases.
    currency_note: >-
      CURRENCY GAP. npm has exactly one release, 0.1.0, published 2026-05-31 and never updated.
      The GitHub repository's package.json at master declares version 0.2.2 and the repo was
      last pushed 2026-07-03 — so the published artifact is at least two minor versions behind
      the source, and more than two months stale. Anyone running `npx -y crawlgraph-mcp` today
      gets 0.1.0, not what the repo describes. This is the local-stdio path only; the hosted
      endpoint at https://crawlgraph.com/mcp is served from the provider's own deploy and is
      unaffected.


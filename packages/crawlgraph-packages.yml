summary: >-
  One first-party published package: the MCP server on npm. There is NO conventional client SDK
  in any language. The docs teach the API with raw curl / Python requests / Node fetch snippets
  instead, which is a deliberate posture for a six-operation API but means an integrator gets no
  typed client. Registry probes for crawlgraph, crawlgraph-sdk, @crawlgraph/sdk (npm) and
  crawlgraph (PyPI) all returned 404.
package_count: 1

name: CrawlGraph
description: >-
  CrawlGraph is a backlink-intelligence SaaS built on Common Crawl's open hyperlink graph (121.1M domains / 3.90B
  domain-level links), positioned as a low-cost alternative to Ahrefs, Moz, Semrush and Majestic. It offers
  referring-domain lookups with authority scoring, competitor gap analysis, warm outreach-target discovery, and
  cross-release change comparison. The product ships an unusually complete developer surface for a solo-operator
  SaaS: a public OpenAPI 3.1 contract, a self-serve free API tier (15 backlink calls a month, no card), a hosted
  remote MCP server whose tools publish both input and output schemas, an open-source local MCP package on npm, a
  published llms.txt, and open CC-BY study datasets. It is operated by Search Engine Wizards in Finland and priced
  as a one-time $99 lifetime licence rather than a subscription.

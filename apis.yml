  - name: CrawlGraph MCP Server
    description: >-
      Hosted remote Model Context Protocol server at https://crawlgraph.com/mcp over Streamable HTTP, plus an
      open-source local stdio fallback published to npm as crawlgraph-mcp (MIT). Four tools — backlinks,
      gap_analysis, gap_outreach_targets, releases — each publishing a JSON Schema inputSchema AND outputSchema
      with behavioural annotations. tools/list answers anonymously; tool invocation uses the same cg_live_ bearer
      key and the same monthly quotas as the REST API. The gap_outreach_targets tool is MCP-value-added: it
      orchestrates the async gap job, tiers results by competitor overlap, filters platform/CDN noise, and
      authority-scores the top targets.
    humanURL: https://crawlgraph.com/docs/api

apis:
  - name: CrawlGraph REST API v1
    description: >-
      JSON REST API for backlink/referring-domain lookups with authority scoring, indexed Common Crawl release
      listing, async competitor gap analysis, and cross-release change comparison. Six operations under
      /api/v1, described by a live OpenAPI 3.1.0 contract served anonymously at
      https://crawlgraph.com/api/v1/openapi.json. Bearer auth with cg_live_ keys. A free self-serve tier
      (15 backlink calls/month, emailed key, no card) is available; gap analysis and the 1,000-call allowance
      require the $99 lifetime tier.
    humanURL: https://crawlgraph.com/docs/api

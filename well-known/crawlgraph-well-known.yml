note: >-
  Re-probed 2026-09-02. Result is unchanged from the 2026-08-13 pass: ONE real hit, a served
  RFC 9116 security.txt, and a genuine HTTP 404 on every other well-known path. crawlgraph.com is
  a Next.js app that returns real status codes for unknown /.well-known/* paths, so these are true
  absences rather than SPA soft-200s — the 404 bodies are the app's HTML error page, which is the
  correct read of a 404, not a false positive.
  ONE THING DID CHANGE, and it is worth recording: the ordinary site paths that used to soft-404
  directly (/pricing, /status, /changelog, /support, /roadmap, /docs, /faq) now answer HTTP 308 and
  redirect into the /backlinks/<domain> report route, which then serves HTTP 200 carrying
  "<path> isn't a valid domain name". The failure mode is the same soft-404 as before, reached one
  hop later. Following the redirect and reading the body is now mandatory before crediting any of
  those pages; the status code alone says 200 twice over.
  The security.txt itself was refreshed by the provider since the last pass — Expires moved from
  2027-08-07 to 2027-08-29 — so the verbatim copy in this directory has been re-harvested.

